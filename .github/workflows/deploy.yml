name: Deploy telcochisel.com

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [catalog-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nuxt/cache
          key: ${{ runner.os }}-nuxt-${{ hashFiles('package-lock.json', 'catalog/tools.json', 'data/**', 'pages/**') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-

      - name: Install dependencies
        run: npm ci

      - name: Sync tool catalog from TelcoChiselOS
        run: npm run sync-catalog

      - name: Generate static site
        env:
          NODE_ENV: production
        run: npm run generate

      - name: Deploy to SourceForge Project Web
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USER: ${{ secrets.SF_USER }}
        if: env.SF_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SF_SSH_KEY" > ~/.ssh/sf_deploy
          chmod 600 ~/.ssh/sf_deploy
          ssh-keyscan -H web.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/sf_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            .output/public/ \
            "${SF_USER},telcochisel@web.sourceforge.net:/home/project-web/telcochisel/htdocs/"
          echo "Deployed to https://telcochisel.sourceforge.io"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
